<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping </title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div class="logo">
            <span>Shopkart</span>
        </div>

        <div class="travel">
            Travel
        </div>

        <div class="location">
             Location not set
        </div>

    </header>


    
    <div class="search-area">

        <div class="search-box">
    
            <input type="text"
                   placeholder="Search for Products, Brands and More">
        </div>

        <div class="login">
                Login 
        </div>

        <div class="more">
            More 
        </div>

        <div class="cart">
            Cart
        </div>

    </div>


    
    <nav>

        <a href="#">For You</a>
        <a href="#">Fashion</a>
        <a href="#">Mobiles</a>
        <a href="#">Electronics</a>
        <a href="#">Beauty</a>
        <a href="#">Home</a>
        <a href="#">Appliances</a>
        <a href="#">Toys</a>
        <a href="#">Food & Health</a>
        <a href="#">Auto Accessories</a>

    </nav>
    <section class="offers">
        <div class="offer-card">
            <img src="image/shoes.jpg">
            <p>Men's Sports Shoes</p>
            <h3>Min. 70% Off</h3>
        </div>
        <div class="offer-card">
            <img src="image/sarees.jpg">
            <p>Women's Sarees</p>
            <h3>Special Offer</h3>
        </div>
    </section>

    <section class="flash-sale">

        <div class="flash-text">

          <h1>FLASH<br>SALE </h1>

        </div>

        <div class="sale-content">

            <h1>Flat 15% Off</h1>

            <p>on Flight bookings</p>

            <span>2-3 PM | 8-9 PM | 10 PM-12 AM</span>

        </div>

        <div class="plane">
            
        </div>

    </section>


    
    
</body>
</html>
